[project]
name = "brain"
version = "0.1.0"
description = "Personal AI brain - local RAG over your own material"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.20",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "rapidocr-onnxruntime>=1.4.4",
    "uvicorn>=0.54.0",
    "vosk>=0.3.45",
    "pymongo>=4.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["httpx2>=1.0.0", "pytest>=8.0"]
